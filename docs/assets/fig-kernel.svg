<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="How a receipt loses a distinction, and why the loss does not stay put">
  <style>
    :root{
      --ink:#0f172a; --mut:#5b6676; --faint:#8b95a5; --line:#d8dee8; --edge:#e7ecf3;
      --pane:#f7f9fc; --pane2:#eef2f8; --card:#ffffff;
      --acc:#4f46e5; --pos:#0d9488; --warn:#b8690c; --dngr:#c02626; --vio:#7c3aed; --steel:#3b6ea5;
      --accSoft:#e8e7fd; --posSoft:#d8f2ee; --warnSoft:#fbecd8; --dngrSoft:#fbe0e0; --vioSoft:#eee6fd; --steelSoft:#e0ebf7;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --ink:#e6edf3; --mut:#9aa7b4; --faint:#6e7d8d; --line:#303844; --edge:#232b36;
        --pane:#11161d; --pane2:#161d26; --card:#0d1117;
        --acc:#8b93f8; --pos:#2dd4bf; --warn:#e8a33d; --dngr:#f87171; --vio:#a78bfa; --steel:#6ea8dc;
        --accSoft:#232449; --posSoft:#123c3a; --warnSoft:#3a2a12; --dngrSoft:#3d1d1d; --vioSoft:#2b2247; --steelSoft:#16283c;
      }
    }
    .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .ink{fill:var(--ink)} .mut{fill:var(--mut)} .faint{fill:var(--faint)}
    .acc{fill:var(--acc)} .pos{fill:var(--pos)} .warn{fill:var(--warn)}
    .dngr{fill:var(--dngr)} .vio{fill:var(--vio)} .steel{fill:var(--steel)}
    .t{font-weight:700;letter-spacing:-0.2px}
    .k{font-weight:600;letter-spacing:0.9px;text-transform:uppercase}
  </style>
  <rect x="0.5" y="0.5" width="1159" height="469" rx="14" fill="var(--card)" stroke="var(--edge)" stroke-width="1"/>
  <text x="28" y="38" class="s acc-k mut k" font-size="10.5">Figure 1 · the provenance kernel</text>
  <text x="28" y="64" class="s ink t" font-size="19">How a receipt loses a distinction, and why the loss does not stay put</text>
<defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/></marker></defs>
<rect x="28" y="108" width="232" height="70" rx="9" fill="var(--steelSoft)" stroke="var(--steel)" stroke-width="1.1"/>
<text x="44" y="133" class="s mut k" font-size="10.5">document A</text>
<text x="44" y="156" class="m ink" font-size="12.5">{"amount":1, "amount":2}</text>
<rect x="28" y="204" width="232" height="70" rx="9" fill="var(--vioSoft)" stroke="var(--vio)" stroke-width="1.1"/>
<text x="44" y="229" class="s mut k" font-size="10.5">document B</text>
<text x="44" y="252" class="m ink" font-size="12.5">{"amount":2}</text>
<text x="28" y="308" class="s mut" font-size="12.5">Two different byte strings.</text>
<text x="28" y="328" class="s mut" font-size="12.5">A declared consumer needs them</text>
<text x="28" y="348" class="s mut" font-size="12.5">kept apart.</text>
<rect x="306" y="132" width="140" height="62" rx="9" fill="var(--pane)" stroke="var(--line)" stroke-width="1"/>
<text x="376" y="158" class="s ink t" font-size="13.5" text-anchor="middle">parse</text>
<text x="376" y="178" class="m faint" font-size="9.5" text-anchor="middle">V8 · CPython · jq · serde</text>
<rect x="470" y="132" width="140" height="62" rx="9" fill="var(--pane)" stroke="var(--line)" stroke-width="1"/>
<text x="540" y="158" class="s ink t" font-size="13.5" text-anchor="middle">canonicalize</text>
<text x="540" y="178" class="m faint" font-size="9.5" text-anchor="middle">sort keys, re-emit</text>
<line x1="446" y1="163" x2="464" y2="163" stroke="var(--mut)" stroke-width="1.4"/>
<path d="M462,159 L468,163 L462,167 z" fill="var(--mut)"/>
<rect x="634" y="132" width="140" height="62" rx="9" fill="var(--pane)" stroke="var(--line)" stroke-width="1"/>
<text x="704" y="158" class="s ink t" font-size="13.5" text-anchor="middle">digest</text>
<text x="704" y="178" class="m faint" font-size="9.5" text-anchor="middle">SHA-256</text>
<line x1="610" y1="163" x2="628" y2="163" stroke="var(--mut)" stroke-width="1.4"/>
<path d="M626,159 L632,163 L626,167 z" fill="var(--mut)"/>
<path d="M266,143 C288,143 288,163 300,163" fill="none" stroke="var(--steel)" stroke-width="1.6"/>
<path d="M266,239 C288,239 288,163 300,163" fill="none" stroke="var(--vio)" stroke-width="1.6"/>
<path d="M298,159 L304,163 L298,167 z" fill="var(--mut)"/>
<line x1="798" y1="163" x2="826" y2="163" stroke="var(--dngr)" stroke-width="1.6"/>
<path d="M824,159 L830,163 L824,167 z" fill="var(--dngr)"/>
<rect x="838" y="132" width="290" height="62" rx="9" fill="var(--dngrSoft)" stroke="var(--dngr)" stroke-width="1.2"/>
<text x="854" y="155" class="s ink t" font-size="12">ONE identity for both</text>
<text x="854" y="176" class="m mut" font-size="11">a2879a37…95a1094d</text>
<text x="306" y="226" class="s ink" font-size="12">The distinction is destroyed HERE — before any audited code runs.</text>
<text x="306" y="246" class="s mut" font-size="11.5">E1 measures this arm-by-arm; E11 reproduces it in four canonicalizers this project did not write.</text>
<rect x="306" y="270" width="822" height="140" rx="10" fill="var(--pane)" stroke="var(--line)" stroke-width="1"/>
<text x="326" y="295" class="s ink t" font-size="13">Soundness is a ternary relation, and neither argument holds still</text>
<text x="742" y="295" class="m acc" font-size="13.5">Sound( C , Σ , P )</text>
<rect x="326" y="314" width="8" height="8" rx="2" fill="var(--warn)"/>
<text x="344" y="322" class="s ink t" font-size="11.5">Σ grows  ⟹  monotone</text>
<text x="510" y="322" class="s mut" font-size="11.5">a wider input alphabet can only ADD kernel members</text>
<rect x="326" y="336" width="8" height="8" rx="2" fill="var(--vio)"/>
<text x="344" y="344" class="s ink t" font-size="11.5">P grows  ⟹  antitone</text>
<text x="510" y="344" class="s mut" font-size="11.5">a wider consumer set can only ADD distinctions that must survive</text>
<line x1="326" y1="376" x2="1108" y2="376" stroke="var(--line)" stroke-width="1" opacity="0.7"/>
<text x="326" y="394" class="s ink" font-size="11.5">Therefore a receipt system that is sound today becomes unsound as consumers are added — with C unchanged and no bug introduced.</text>
<line x1="28" y1="426" x2="1132" y2="426" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
  <text x="28" y="448" class="m faint" font-size="10.5">ker(C) = { (a,b) : digest(C(a)) = digest(C(b)) } · formal statement: docs/research/PROVENANCE_KERNEL_PROBLEM.md</text>
</svg>
