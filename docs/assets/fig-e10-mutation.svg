  <text x="28" y="64" class="s ink t" font-size="19">Mutation score over the receipt trust kernel: would the tests notice if it were wrong?</text>
<text x="28" y="92" class="s mut" font-size="12">Stryker makes one small semantic change at a time and asks whether any test fails. A surviving mutant is a demonstrated gap; a killed mutant is only the absence of that one gap.</text>
