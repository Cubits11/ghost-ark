<text x="48" y="526" class="s mut" font-size="11">red tick = the score before remediation, kept in the picture so an improvement cannot be shown without the state it improved on.</text>
<text x="28" y="548" class="s mut" font-size="11">Sweep aggregate: 85.8% covered-denominator, 83.6% total-denominator. Sweep aggregate measured BEFORE the second remediation round; the two remediated rows below are therefore not reflected in it.</text>
<text x="28" y="568" class="s faint" font-size="11">The threshold has been wrong once and is now set from measurement: 75 → 58 → 70 → 80, each step after a sweep rather than before one.</text>
