<text x="666.01" y="310" class="m ink t" font-size="11">149,796</text>
<text x="300" y="310" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
<rect x="800" y="296" width="300" height="22" rx="6" fill="var(--dngrSoft)" stroke="var(--dngr)" stroke-width="1"/>
<text x="812" y="311" class="s ink t" font-size="10.5">VIOLATION REPRODUCED</text>
<text x="1096" y="311" class="s mut" font-size="9" text-anchor="end">count withdrawn (R11)</text>
<rect x="28" y="330" width="1104" height="40" rx="0" fill="var(--pane)" opacity="0.5"/>
<text x="28" y="351" class="m ink" font-size="12">DAB_NonceLedger</text>
<text x="28" y="365" class="s faint" font-size="9.5">dab gateway model</text>
<rect x="320" y="343" width="202.62" height="14" rx="3" fill="var(--steel)" opacity="0.85"/>
<text x="532.62" y="354" class="m ink t" font-size="11">1,321</text>
<text x="300" y="354" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
<rect x="800" y="340" width="300" height="22" rx="6" fill="var(--dngrSoft)" stroke="var(--dngr)" stroke-width="1"/>
<text x="812" y="355" class="s ink t" font-size="10.5">VIOLATION REPRODUCED</text>
<text x="1096" y="355" class="s mut" font-size="9" text-anchor="end">count withdrawn (R11)</text>
<text x="28" y="395" class="m ink" font-size="12">DAB_ExecutionBoundary</text>
<text x="28" y="409" class="s faint" font-size="9.5">dab gateway model</text>
<rect x="320" y="387" width="305.69" height="14" rx="3" fill="var(--steel)" opacity="0.85"/>
<text x="635.69" y="398" class="m ink t" font-size="11">51,106</text>
<text x="300" y="398" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
<rect x="800" y="384" width="300" height="22" rx="6" fill="var(--warnSoft)" stroke="var(--warn)" stroke-width="1"/>
<text x="812" y="399" class="s ink t" font-size="10.5">no mutant — checked, not gated</text>
<text x="1096" y="399" class="s mut" font-size="9" text-anchor="end">one-sided</text>
<line x1="28" y1="432" x2="1132" y2="432" stroke="var(--line)" stroke-width="1" opacity="0.7"/>
<text x="28" y="456" class="s ink t" font-size="12">Why the mutant state counts are absent, deliberately.</text>
<text x="28" y="476" class="s mut" font-size="11">Baseline state counts are a model property and reproduce exactly. MUTANT state counts are withdrawn under retraction R11: a mutant halts at the first</text>
<text x="28" y="493" class="s mut" font-size="11">counterexample and TLC runs -workers auto, so the count varies run to run. The VIOLATION_REPRODUCED verdict is stable; only the count is withdrawn.</text>
<text x="28" y="532" class="s faint" font-size="11">Baseline counts are reproducible and are printed. The gate is a yes/no verdict and is unaffected — five baselines must pass and five mutants must violate.</text>
<line x1="28" y1="536" x2="1132" y2="536" stroke="var(--line)" stroke-width="1" opacity="0.6"/>
  <text x="28" y="558" class="m faint" font-size="10.5">make proof · tla2tools v1.7.4 · all gating specs met expectation · measured 2026-08-12</text>
</svg>
