<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" width="1160" height="580" role="img" aria-label="Formal models: every gated invariant ships a mutant that must break it">
  <style>
    :root{
      --ink:#0f172a; --mut:#5b6676; --faint:#8b95a5; --line:#d8dee8; --edge:#e7ecf3;
      --pane:#f7f9fc; --pane2:#eef2f8; --card:#ffffff;
      --acc:#4f46e5; --pos:#0d9488; --warn:#b8690c; --dngr:#c02626; --vio:#7c3aed; --steel:#3b6ea5;
      --accSoft:#e8e7fd; --posSoft:#d8f2ee; --warnSoft:#fbecd8; --dngrSoft:#fbe0e0; --vioSoft:#eee6fd; --steelSoft:#e0ebf7;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --ink:#e6edf3; --mut:#9aa7b4; --faint:#6e7d8d; --line:#303844; --edge:#232b36;
        --pane:#11161d; --pane2:#161d26; --card:#0d1117;
        --acc:#8b93f8; --pos:#2dd4bf; --warn:#e8a33d; --dngr:#f87171; --vio:#a78bfa; --steel:#6ea8dc;
        --accSoft:#232449; --posSoft:#123c3a; --warnSoft:#3a2a12; --dngrSoft:#3d1d1d; --vioSoft:#2b2247; --steelSoft:#16283c;
      }
    }
    .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .ink{fill:var(--ink)} .mut{fill:var(--mut)} .faint{fill:var(--faint)}
    .acc{fill:var(--acc)} .pos{fill:var(--pos)} .warn{fill:var(--warn)}
    .dngr{fill:var(--dngr)} .vio{fill:var(--vio)} .steel{fill:var(--steel)}
    .t{font-weight:700;letter-spacing:-0.2px}
    .k{font-weight:600;letter-spacing:0.9px;text-transform:uppercase}
  </style>
  <rect x="0.5" y="0.5" width="1159" height="579" rx="14" fill="var(--card)" stroke="var(--edge)" stroke-width="1"/>
  <text x="28" y="38" class="s acc-k mut k" font-size="10.5">Figure 6 · TLA+ specifications</text>
  <text x="28" y="64" class="s ink t" font-size="19">Formal models: every gated invariant ships a mutant that must break it</text>
<text x="28" y="92" class="s mut" font-size="12">A green invariant with no failing mutant is not evidence. Each baseline below is paired with a deliberately broken variant that CI requires to produce a counterexample.</text>
<line x1="449.85" y1="142" x2="449.85" y2="412" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/>
<text x="449.85" y="134" class="m faint" font-size="9.5" text-anchor="middle">100</text>
<line x1="514.77" y1="142" x2="514.77" y2="412" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/>
<text x="514.77" y="134" class="m faint" font-size="9.5" text-anchor="middle">1,000</text>
<line x1="579.7" y1="142" x2="579.7" y2="412" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/>
<text x="579.7" y="134" class="m faint" font-size="9.5" text-anchor="middle">10,000</text>
<line x1="644.62" y1="142" x2="644.62" y2="412" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4" opacity="0.45"/>
<text x="644.62" y="134" class="m faint" font-size="9.5" text-anchor="middle">100,000</text>
<text x="320" y="116" class="s faint k" font-size="10">distinct states explored (log scale)</text>
<text x="800" y="116" class="s faint k" font-size="10">paired mutant</text>
<rect x="28" y="154" width="1104" height="40" rx="0" fill="var(--pane)" opacity="0.5"/>
<text x="28" y="175" class="m ink" font-size="12">ProvenanceLattice</text>
<text x="28" y="189" class="s faint" font-size="9.5">core provenance model</text>
<rect x="320" y="167" width="363.99" height="14" rx="3" fill="var(--steel)" opacity="0.85"/>
<text x="693.99" y="178" class="m ink t" font-size="11">403,949</text>
<text x="300" y="178" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
