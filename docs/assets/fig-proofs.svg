<text x="812" y="179" class="s ink t" font-size="10.5">VIOLATION REPRODUCED</text>
<text x="1096" y="179" class="s mut" font-size="9" text-anchor="end">count withdrawn (R11)</text>
<text x="28" y="219" class="m ink" font-size="12">SpeculativeCollapse</text>
<text x="28" y="233" class="s faint" font-size="9.5">core provenance model</text>
<rect x="320" y="211" width="176.82" height="14" rx="3" fill="var(--steel)" opacity="0.85"/>
<text x="506.82" y="222" class="m ink t" font-size="11">529</text>
<text x="300" y="222" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
<rect x="800" y="208" width="300" height="22" rx="6" fill="var(--dngrSoft)" stroke="var(--dngr)" stroke-width="1"/>
<text x="812" y="223" class="s ink t" font-size="10.5">VIOLATION REPRODUCED</text>
<text x="1096" y="223" class="s mut" font-size="9" text-anchor="end">count withdrawn (R11)</text>
<rect x="28" y="242" width="1104" height="40" rx="0" fill="var(--pane)" opacity="0.5"/>
<text x="28" y="263" class="m ink" font-size="12">TransportBoundary</text>
<text x="28" y="277" class="s faint" font-size="9.5">core provenance model</text>
<rect x="320" y="255" width="117.26" height="14" rx="3" fill="var(--steel)" opacity="0.85"/>
<text x="447.26" y="266" class="m ink t" font-size="11">64</text>
<text x="300" y="266" class="s pos t" font-size="10" text-anchor="end">CLEAN</text>
<rect x="800" y="252" width="300" height="22" rx="6" fill="var(--dngrSoft)" stroke="var(--dngr)" stroke-width="1"/>
<text x="812" y="267" class="s ink t" font-size="10.5">VIOLATION REPRODUCED</text>
<text x="1096" y="267" class="s mut" font-size="9" text-anchor="end">count withdrawn (R11)</text>
<text x="28" y="307" class="m ink" font-size="12">TenantIsolation</text>
<text x="28" y="321" class="s faint" font-size="9.5">core provenance model</text>
