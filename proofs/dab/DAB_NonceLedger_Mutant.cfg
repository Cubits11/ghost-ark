\* Configuration for the deliberately-broken nonce-ledger mutant.
\*
\* This file exists so tools/proofs/run-tlc.sh can assert the mutant VIOLATES its
\* invariant. Without it the mutant was silently skipped, which meant the baseline's
\* NoReplays invariant was never shown to be load-bearing: an invariant that passes
\* proves nothing until its mutant is shown to fail.
\*
\* Constants mirror DAB_NonceLedger.cfg exactly. They must stay in sync — a mutant checked
\* under a different state space is not a comparison. If the baseline's constants change,
\* change them here too.

SPECIFICATION Spec

CONSTANTS
    Agents = {a1, a2, a3}
    Nonces = {n1, n2, n3, n4, n5}
    MaxLedgerSize = 3

INVARIANT
    NoReplays

PROPERTY
    EventualGC
