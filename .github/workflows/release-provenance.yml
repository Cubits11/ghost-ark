name: release-provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Signing is not idempotent in a useful way here; let a tag finish.
concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: mkdir -p artifacts
      - name: Generate release manifest
        run: |
          {
            echo "ghost-ark release manifest"
            echo "git_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            find package.json package-lock.json tsconfig.json dist -type f -print | sort | xargs shasum -a 256
          } > artifacts/release-manifest.sha256
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign release manifest
        run: cosign sign-blob --yes --bundle artifacts/release-manifest.sigstore.json artifacts/release-manifest.sha256
      - name: Sign SBOM
        run: cosign sign-blob --yes --bundle artifacts/sbom.sigstore.json artifacts/sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghost-ark-provenance-${{ github.sha }}
          path: artifacts/
