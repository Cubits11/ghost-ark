name: artifacts-verify

# CI previously verified only the TypeScript workspace. The Rust gateway/verifier
# (2,877 lines), the TLA+ specifications and their mutants, and the Python verifier were
# all unguarded, so the repository's most load-bearing artifacts could rot without any
# signal. This workflow closes that gap. The exact coverage matrix, including what is
# STILL unverified, is docs/artifact/CI_COVERAGE.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to main are not, so main
# keeps a completed verification record per commit.
concurrency:
  group: artifacts-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tools/experiments is the dependency-free Rust measurement crate (MAD,
        # tie-corrected Mann-Whitney, counter-resolution probe). It was orphaned:
        # referenced by no CI, no doc, and no test runner, and it carried two clippy
        # violations when first gated here.
        crate: [dab/gateway, dab/verifier, tools/experiments]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned to a commit, which means the toolchain can no longer be inferred
      # from the ref name — `@stable` was both the pin and the input. `toolchain`
      # now carries that intent explicitly; dropping it silently selects nothing.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ matrix.crate }}
      # --locked so a drifting Cargo.lock fails the build instead of being silently updated.
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: ${{ matrix.crate }}
      # clippy is clean on macOS/aarch64 and fails on Linux/x86_64, so the
      # difference is in cfg-gated or platform-specific code that never compiles
      # on the development host. Surface it in the job summary, which is
      # readable from the check-run output without repository credentials.
      - name: cargo clippy (deny warnings)
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee /tmp/clippy-${{ strategy.job-index }}.log
        working-directory: ${{ matrix.crate }}
      - name: Surface clippy failure
        if: failure() && steps.clippy.outcome == 'failure'
        run: |
          {
            echo "### clippy failed — ${{ matrix.crate }}"
            echo ''
            echo "\`$(rustc --version)\` · \`$(cargo clippy --version)\` · runner \`$(uname -sm)\`"
            echo ''
            echo '```'
            grep -E '^(error|warning)' -A6 /tmp/clippy-${{ strategy.job-index }}.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo test
        run: cargo test --locked
        working-directory: ${{ matrix.crate }}

  python-verifier:
    name: python independent verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: compile all tracked python
        run: python -m py_compile verifiers/python/ghost_receipt_verify.py services/transform/glue/jobs/*.py tests/aws/dev-account/*.py
      # The third independent verifier arm must actually verify, not merely compile.
      - name: verify the HMAC baseline fixture
        run: |
          python3 verifiers/python/ghost_receipt_verify.py \
            --receipt examples/reproducibility/receipts/hmac-baseline.receipt.json \
            --hmac-secret ghost-ark-repro-signing-dev-only-test-vector-v1 \
            --expected-key-id local-dev-hmac
      - name: confirm a tampered receipt is REJECTED (negative control)
        run: |
          # A verifier that passes everything would pass the step above too. This step
          # fails the job if the tampered fixture is NOT rejected.
          if python3 verifiers/python/ghost_receipt_verify.py \
              --receipt examples/malicious-receipts/receipts/MAL-003.altered-signature.receipt.json \
              --hmac-secret ghost-ark-repro-signing-dev-only-test-vector-v1 \
              --expected-key-id local-dev-hmac > /dev/null 2>&1; then
            echo "FAIL: python verifier accepted a receipt with an altered signature"
            exit 1
          fi
          echo "OK: altered-signature fixture rejected"

  tla-proofs:
    name: TLA+ specs and their mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      # This job used to fetch the jar with a bare curl and no integrity check,
      # so it ran TLA+ against whatever the URL served while the PINNED path in
      # scripts/run-proofs.sh refused to run at all. The green TLA+ result this
      # repository reported therefore came from an unverified toolchain.
      #
      # The digest is read from scripts/run-proofs.sh rather than duplicated, so
      # the two runners cannot drift to different pins.
      - name: fetch tla2tools (integrity-checked against the recorded pin)
        run: |
          set -euo pipefail
          expected=$(grep -oE '^TLA_TOOLS_SHA256="[0-9a-f]{64}"' scripts/run-proofs.sh | cut -d'"' -f2)
          version=$(grep -oE '^TLA_TOOLS_VERSION="[^"]+"' scripts/run-proofs.sh | cut -d'"' -f2)
          test -n "$expected" && test -n "$version"
          curl -fsSL -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${version}/tla2tools.jar"
          actual=$(sha256sum tla2tools.jar | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "tla2tools.jar sha256 $actual != pinned $expected" >&2
            exit 1
          fi
          echo "tla2tools ${version} verified: ${actual}"
      # A specification that passes proves nothing on its own — an invariant can hold
      # vacuously. Each spec is paired with a mutant that MUST produce a violation. This
      # job asserts both directions, which is what makes the invariants load-bearing.
      - name: check specs (must pass) and mutants (must fail)
        run: bash tools/proofs/run-tlc.sh

  experiments:
    name: experiments E1-E7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # E1's fourth arm needs a genuinely independent JSON parser. Without Python the
          # arm reports itself unavailable rather than silently inflating agreement.
          python-version: "3.12"
      - run: npm ci
      # jq and the Rust arm must exist BEFORE the guard tests, not after. E11
      # skips itself when a runtime is missing, and a skipped generality test is
      # worse than no test: it reports green while measuring nothing. The
      # ordering here is the difference between running the experiment and
      # merely owning it.
      - name: install jq (E7 third arm, E11 fourth arm)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: build the E11 serde_json arm
        run: npm run build:e11-arm
      - name: confirm every E11 third-party runtime is present
        run: |
          set -euo pipefail
          ruby -v && python3 --version && jq --version && rustc --version
          test -x tools/experiments-json/target/debug/serde-json-arm
      - name: experiment guards and repo hygiene
        # GHOST_ARK_REQUIRE_E11 turns a missing third-party runtime from a skip
        # into a failure. This is the job that runs E11 for real; everywhere else
        # it may legitimately skip.
        env:
          GHOST_ARK_REQUIRE_E11: "1"
        run: npm run test:experiments
      # E2 is a timing experiment; a shared CI runner is noisy, so it runs with reduced
      # iterations purely as a smoke test. CI numbers are NOT the reported numbers.
      # jq is E7's third independent parser arm. Without it E7 still runs on two arms and says
      # so, rather than silently reporting zero divergence for lack of anything to disagree with.
      - name: report third-party runtime versions used by E11
        run: |
          {
            echo "### E11 third-party arm versions"
            echo ''
            echo '```'
            ruby -v; python3 --version; jq --version; rustc --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: run all experiments (E1, E1-B, E2, E3, E4, E5, E6, E7, E11)
        run: npm run experiments

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config where any later step or
          # dependency script could read it. This job installs and executes third-party
          # code, so it is exactly the job that should not hold a credential.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # lockfile-lint has been a devDependency for some time but was never executed.
      # It asserts every resolved URL is an HTTPS npm host, which is what makes a lockfile
      # a supply-chain control rather than a record of whatever resolved that day.
      - name: lockfile integrity
        run: npx lockfile-lint --path package-lock.json --allowed-hosts npm --validate-https

      # Every lockfile in the tree, not only the root one. `dab/agent-runtime` is outside
      # the root workspaces, so nothing here ever read it -- and what sat at that path was
      # a COPY OF package.json rather than a lockfile, which made `npm audit` in that
      # directory report a false 0 while Dependabot resolved the manifest ranges and found
      # a critical. A gate that covers one lockfile in a repository with two is not a
      # supply-chain control; it is a supply-chain control for half the supply chain.
      - name: lockfile integrity (dab/agent-runtime)
        run: npx lockfile-lint --path dab/agent-runtime/package-lock.json --allowed-hosts npm --validate-https

      # Threshold set to what the repository can actually hold green today. The remaining
      # advisories are devDependency-only and are enumerated in docs/artifact/CI_COVERAGE.md.
      # Raising this to --audit-level=high requires clearing the SBOM toolchain chain; the
      # honest move is a failing threshold we meet, not a passing one we ignore.
      - name: npm audit (critical)
        run: npm audit --audit-level=critical

      # Same threshold, applied where the critical actually was.
      - name: npm audit (critical, dab/agent-runtime)
        run: npm audit --audit-level=critical --prefix dab/agent-runtime

      # Report the dev-only advisories without failing, so the count is visible in every run
      # and a regression is noticed rather than discovered during a review.
      - name: npm audit report (non-blocking, visibility only)
        run: npm audit || true
