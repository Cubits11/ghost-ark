name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the top, widened per job. `security-events: write` used to
# sit here, which handed the token that can write to the Security tab to every
# job in the file — including `validate`, which runs `npm ci` and therefore
# executes third-party install code. Only the two jobs that upload SARIF need it.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to main are not. A main run
# is the record that a commit was verified, and cancelling it leaves a commit
# whose check state is "cancelled" — indistinguishable, months later, from one
# nobody ran.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` failed on every run of this workflow for weeks while passing on
      # a clean clone locally, and the runner log is not readable without repo
      # credentials. Capturing the output into the job summary makes an install
      # failure diagnosable from the check-run output alone — which is the only
      # surface a reviewer without write access can see either.
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
      - name: Surface install failure
        if: failure() && steps.install.outcome == 'failure'
        run: |
          {
            echo '### npm ci failed'
            echo ''
            echo "node \`$(node -v)\` · npm \`$(npm -v)\` · runner \`$(uname -sr)\`"
            echo ''
            echo '```'
            tail -80 /tmp/npm-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run validate
      - run: python -m py_compile services/transform/glue/jobs/*.py tests/aws/dev-account/*.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: bash tools/policy-sim/simulate.sh --dry-run --profile example-tenant

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  semgrep:
    name: semgrep (SARIF to the Security tab, gated at ERROR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # This job used `semgrep/semgrep-action@v1`, which is deprecated and
      # internally pulls `returntocorp/semgrep-agent:v1` — the image whose Docker
      # Hub pull failed one run in six (docs/artifact/CI_COVERAGE.md). It also
      # uploaded nothing: `security-events: write` was granted and never used, so
      # 96 findings existed only in a log that a reviewer without write access
      # cannot open. Running the pinned CLI and uploading SARIF puts them in the
      # Security tab, where the permission was pointing all along.
      - name: install semgrep (pinned)
        run: pip install --no-cache-dir semgrep==1.172.0

      # No `|| true`: `semgrep scan` without `--error` exits 0 whether or not it
      # finds anything (verified against 1.172.0), so a non-zero exit here is a
      # genuine crash and should fail the step rather than be swallowed. Findings
      # are decided by the gate below, after the upload.
      #
      # An absent report is NOT the same as a clean one, so an empty or missing
      # SARIF fails here rather than passing as zero findings.
      - name: scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/default --config=p/security-audit --config=p/secrets \
            --sarif --output=semgrep.sarif --metrics=off --quiet
          if [ ! -s semgrep.sarif ]; then
            echo "semgrep produced no SARIF report — recording a failed scan, not a clean one" >&2
            exit 1
          fi

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Gated at ERROR severity, which is the level this repository actually
      # meets (0 findings; the one real ERROR — a shell injection this project
      # introduced in mutation.yml — is fixed). WARNING and INFO findings remain
      # an untriaged backlog: visible in the Security tab and in the job summary
      # histogram, deliberately not gated. A gate set above the level met is one
      # people learn to skip.
      - name: severity histogram and ERROR gate
        run: node tools/ci/sarif-gate.mjs semgrep.sarif semgrep error-only

  gitleaks:
    name: gitleaks (full history, no organisation licence required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Secrets are a history property, not a working-tree property. A
          # shallow clone scans the tip and reports clean over a committed key.
          fetch-depth: 0

      # This job used `gitleaks/gitleaks-action@v2`, which REQUIRES a licence key
      # for repositories owned by an ORGANISATION: "If you are scanning repos
      # that belong to an organization account, you will need to obtain a free
      # license key." Under a personal account it ran green. Moving this
      # repository to an institutional organisation would have failed the secret
      # scanner on the first push — with a licensing error, which reads like
      # noise and gets muted, on the one job whose silence is most expensive.
      #
      # The gitleaks CLI carries no such condition. It is pinned by version AND
      # sha256, the same discipline tools/proofs applies to tla2tools.jar: a
      # scanner fetched without an integrity check cannot attest to what ran.
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --exit-code 0 defers the verdict to the gate below so the SARIF uploads
      # first. --redact keeps the secret itself out of the log and out of the
      # report; a secret scanner that prints its findings in a public log has
      # published them a second time.
      - name: scan every ref present in the checkout
        run: |
          set -euo pipefail
          ./gitleaks git . --log-opts=--all --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif --exit-code 0
          if [ ! -s gitleaks.sarif ]; then
            echo "gitleaks produced no SARIF report — recording a failed scan, not a clean one" >&2
            exit 1
          fi

      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # "any", not "error-only": gitleaks 8.30.1 emits results with no SARIF
      # `level` at all, so an error-only gate would score every leak as zero and
      # pass. Verified against this repository's own history, where the single
      # true finding came back unlevelled. There is also no such thing as an
      # informational secret.
      - name: secret gate
        run: node tools/ci/sarif-gate.mjs gitleaks.sarif gitleaks any
