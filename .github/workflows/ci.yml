name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # `npm ci` failed on every run of this workflow for weeks while passing on
      # a clean clone locally, and the runner log is not readable without repo
      # credentials. Capturing the output into the job summary makes an install
      # failure diagnosable from the check-run output alone — which is the only
      # surface a reviewer without write access can see either.
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/npm-ci.log
      - name: Surface install failure
        if: failure() && steps.install.outcome == 'failure'
        run: |
          {
            echo '### npm ci failed'
            echo ''
            echo "node \`$(node -v)\` · npm \`$(npm -v)\` · runner \`$(uname -sr)\`"
            echo ''
            echo '```'
            tail -80 /tmp/npm-ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run validate
      - run: python -m py_compile services/transform/glue/jobs/*.py tests/aws/dev-account/*.py
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false
      - run: terraform -chdir=infra/terraform/bootstrap validate
      - run: bash tools/policy-sim/simulate.sh --dry-run --profile example-tenant

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/security-audit
            p/secrets

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
