name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One production deployment at a time, and never cancelled mid-apply: an
# interrupted CloudFormation change set leaves stacks in a state no later run
# reasons about correctly.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      GHOST_ARK_ORCHESTRATION_GLUE_CRAWLER_ARNS: ${{ vars.GHOST_ARK_ORCHESTRATION_GLUE_CRAWLER_ARNS }}
      GHOST_ARK_ORCHESTRATION_ATHENA_WORKGROUP_ARNS: ${{ vars.GHOST_ARK_ORCHESTRATION_ATHENA_WORKGROUP_ARNS }}
      GHOST_ARK_ORCHESTRATION_LAMBDA_FUNCTION_ARNS: ${{ vars.GHOST_ARK_ORCHESTRATION_LAMBDA_FUNCTION_ARNS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npx cdk synth --app "node dist/infra/cdk/bin/app.js" -c stage=prod
      - run: npx cdk deploy --app "node dist/infra/cdk/bin/app.js" --all -c stage=prod --require-approval never
