name: artifact-evaluation

# USENIX Artifact Evaluation pipeline. Runs the full honest reproduction and
# uploads the machine- and human-readable reports plus the dissertation PDF.
#
# Job status reflects the repository's ACTUAL state, whatever it is: `make
# reproduce` is fail-closed and is never patched around to go green. Reports
# upload on success OR failure, so a red run is diagnosable rather than silent.
#
# This comment previously asserted that `make reproduce` exits non-zero "while
# the known HEAD blockers remain". Those blockers are now recorded as RESOLVED or
# CLOSED in docs/artifact/repository_inventory.md §7, and AGENTS.md records this
# workflow green on main as of 2026-08-01 — so the comment was asserting a
# failure the repository no longer believes in. Read the check-run status, not
# this header: a workflow file is not evidence about its own last result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dissertation toolchain (pandoc + TeX Live)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq graphviz pandoc latexmk \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern

      - name: Bootstrap (deps + pinned tla2tools)
        run: make bootstrap

      - name: Reproduce (build → claims → proof → unit → attack → benchmark → dissertation → report)
        id: reproduce
        run: make reproduce
        # Do not mask the real result; the report step still runs via always().

      - name: Ensure a report exists even if a stage failed
        if: always()
        run: node tools/artifact/aec-report.mjs || true

      - name: Upload artifacts (reports, benchmarks, proof logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aec-artifacts
          path: |
            artifacts/**
            docs/dissertation/ghost-ark-usenix.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          if [ -f artifacts/reports/aec_summary.md ]; then
            cat artifacts/reports/aec_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  hermetic-image:
    # Proves Dockerfile.reviewer is self-sufficient (no host setup) by running
    # the deterministic gates inside the image.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build reviewer image
        run: docker build -f Dockerfile.reviewer -t ghost-ark-reviewer:ci .
      - name: Run proofs + attacks inside the hermetic image
        run: |
          docker run --rm ghost-ark-reviewer:ci make proof
          docker run --rm ghost-ark-reviewer:ci make attack
